name: Build Database

on:
  push:
    branches: [ main ]
    paths:
      - 'data/conferences/**'
      - 'scripts/build_db.py'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install pyyaml

      - name: Run Build Script
        run: python scripts/build_db.py

      - name: Commit JSON Artifact
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update conferences.json static api"
          file_pattern: public/conferences.json