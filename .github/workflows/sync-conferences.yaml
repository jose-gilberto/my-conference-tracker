name: Sync External Conferences

on:
  schedule:
    # Runs every monday at 8:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # allow running manually

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Runs harvester
        run: python scripts/harvester.py

      - name: Create a Pull Request with the New Conferences
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update conference data from external sources"
          title: "Auto-Update: New dates detected"
          body: |
            The harvester detected changes in external conferences dates.
            
            Please, review the changes in YAML files before approve.
            - Source: ai-deadlines
          branch: "bot/auto-sync"
          delete-branch: true
          base: main